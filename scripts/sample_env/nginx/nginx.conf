worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
    # 标准 combined 衍生格式，额外带上 X-Forwarded-For 便于还原真实源 IP
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name web-prod-01;

        root /usr/share/nginx/html;
        index index.html;

        # 正常业务入口
        location = / { try_files /index.html =404; }
        location = /index.html { }

        # 登录接口：模拟认证成功/失败，按 password 参数区分
        location = /admin/login.php {
            default_type application/json;
            if ($arg_password ~ "OR.*1=1|UNION|--") {
                return 200 '{"code":0,"msg":"login ok","token":"sess-9f8a7b"}';
            }
            return 401 '{"code":401,"msg":"invalid credentials"}';
        }

        location = /api/login {
            default_type application/json;
            return 200 '{"code":0,"msg":"ok","token":"sess-a1b2c3"}';
        }

        location = /api/user {
            default_type application/json;
            return 200 '{"id":1,"name":"admin","dept":"ops"}';
        }

        # 文件上传落地点，模拟 webshell 写入后可达
        location = /uploads/shell.php {
            default_type text/plain;
            return 200 'ok';
        }

        # 敏感路径，按真实站点常见策略返回不同错误
        location ~ ^/(\.env|\.git|wp-admin|wp-login\.php|config\.php) {
            return 404;
        }

        location /phpmyadmin/ {
            return 403;
        }
    }
}
